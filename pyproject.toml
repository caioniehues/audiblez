[project]
name = "audiblez"
version = "0.4.9"
description = "Generate audiobooks from e-books (epub to wav/m4b)"
authors = [
    { name = "Claudio Santini", email = "hireclaudio@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ebooklib>=0.18,<0.19",
    "soundfile>=0.13.1,<0.14.0",
    "pick>=2.4.0,<3.0.0",
    "beautifulsoup4>=4.12,<5",
    "lxml>=4.9",
    "spacy>=3.8.3,<4.0.0",
    "kokoro==0.9.4",
    "misaki[zh]>=0.9.2",
    "torch>=2.0.0",
    "numpy>=1.24",
    "tabulate>=0.9.0,<0.10.0",
]
exclude = [
    "imgs",
    "test",
    "*.wav",
    "*.m4b",
    "cover",
    "chapters.txt"
]

[project.optional-dependencies]
# GUI-only dependencies. Install the graphical interface with:
#   pip install "audiblez[ui]"
ui = [
    "wxPython>=4.2.0",
    "Pillow>=10.0.0",
]
# Apple Silicon native narration engine (optional). Install with:
#   pip install "audiblez[mlx]"
mlx = [
    "mlx-audio>=0.4.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://claudio.uk/posts/epub-to-audiobook.html"
Documentation = "https://github.com/santinic/audiblez"
Repository = "https://github.com/santinic/audiblez"
Issues = "https://github.com/santinic/audiblez/issues"

[project.scripts]
audiblez = "audiblez.cli:cli_main"
audiblez-ui = "audiblez.ui:main"

[tool.poetry.group.dev.dependencies]
deptry = "^0.23.0"

[tool.deptry.per_rule_ignores]
# lxml is used via BeautifulSoup(features='lxml') (not imported by name);
# misaki[zh] provides kokoro's Chinese g2p backend used at runtime.
DEP002 = ["lxml", "misaki"]
# phonemizer (provided by phonemizer-fork) is supplied by the kokoro/misaki TTS
# stack and imported under a guarded try/except in set_espeak_library.
DEP003 = ["phonemizer"]